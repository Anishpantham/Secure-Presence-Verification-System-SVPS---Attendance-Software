[project]
name = "spvs-backend"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.160.0", "starlette==1.9.0", "uvicorn[standard]==0.34.2", "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40", "psycopg[binary]==3.2.9", "alembic==1.15.2",
  "PyJWT==2.15.1", "argon2-cffi==23.1.0", "cryptography==50.0.2",
  "python-multipart==0.0.32", "email-validator==2.2.0",
  "numpy==1.26.4", "opencv-contrib-python==4.11.0.86", "mediapipe==1.1.1",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "pytest-cov==6.1.1", "reportlab==4.4.0", "markdown==3.8", "pypdf==5.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
