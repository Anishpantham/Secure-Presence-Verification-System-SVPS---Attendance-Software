name: spvs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spvs}
      POSTGRES_DB: ${POSTGRES_DB:-spvs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spvs -d spvs"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://spvs:${POSTGRES_PASSWORD}@db:5432/spvs
      MODEL_DIR: /app/models
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: ["./models:/app/models:ro"]
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  dashboard:
    build: ./dashboard
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata:
